#textdomain wesnoth-wc

# WC3 final bosses. Standalone unit types (no [base_unit]) so mainline rebalances can't change
# them. Signature mechanics are described by [dummy] abilities and run in lua/wc2x/boss_roster.lua;
# everything else here is plain WML (stock specials, WC3 specials, condition filters).

[unit_type]
    id=WC3 Lich Sovereign
    name= _ "Lich Sovereign"
    race=undead
    image="units/wc3-bosses/lich-sovereign.png"
    profile="portraits/wc3-bosses/lich-sovereign.png"
    hitpoints=120
    movement_type=undeadfoot
    movement=6
    experience=500
    level=5
    alignment=chaotic
    advances_to=null
    cost=300
    usage=mixed fighter
    do_not_list=yes
    die_sound=lich-die.ogg
    description= _ "An ancient sorcerer who bound his soul to phylacteries hidden across the land. While any of them survives, death is only an inconvenience."
    [abilities]
        {ABILITY_REGENERATES}
        {ABILITY_SKIRMISHER}
        [leadership]
            id=wc3_chill_of_the_grave
            value=-15
            cumulative=no
            name= _ "chill of the grave"
            description= _ "Adjacent enemy units deal 15% less damage."
            affect_self=no
            affect_allies=no
            affect_enemies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/leadership]
        [dummy]
            id=wc3_phylactery
            name= _ "phylactery"
            description= _ "While any of this unit's phylacteries survives, it rises again at its keep with half its hitpoints after being slain."
        [/dummy]
    [/abilities]
    [attack]
        name=soul rend
        description= _ "soul rend"
        icon=attacks/touch-undead.png
        type=arcane
        range=melee
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
            {WEAPON_SPECIAL_PLAGUE_TYPE Soulless}
        [/specials]
    [/attack]
    [attack]
        name=grave chill
        description= _ "grave chill"
        icon=attacks/iceball.png
        type=cold
        range=ranged
        damage=10
        number=4
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]
    [attack]
        name=death knell
        description= _ "death knell"
        icon=attacks/dark-missile.png
        type=arcane
        range=ranged
        damage=28
        number=1
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=soul rend
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wc3-bosses/lich-sovereign.png:400"
        [/frame]
        {SOUND:HIT_AND_MISS wail-sml.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=grave chill
        [/filter_attack]
        {MISSILE_FRAME_CHILL_TEMPEST 0 -15}
        start_time=-300
        [frame]
            image="units/wc3-bosses/lich-sovereign.png:500"
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark-big.ogg magic-dark-big-miss.ogg -150}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=death knell
        [/filter_attack]
        {MISSILE_FRAME_SHADOW_WAVE}
        start_time=-300
        [frame]
            image="units/wc3-bosses/lich-sovereign.png:500"
        [/frame]
        {SOUND:HIT_AND_MISS magic-dark-big.ogg magic-dark-big-miss.ogg -50}
    [/attack_anim]
[/unit_type]

[unit_type]
    id=WC3 Phylactery
    name= _ "Phylactery"
    race=undead
    image="units/wc3-bosses/phylactery.png"
    hitpoints=36
    movement_type=undeadfoot
    movement=0
    experience=500
    level=0
    alignment=chaotic
    advances_to=null
    cost=0
    usage=scout
    do_not_list=yes
    die_sound=lich-die.ogg
    description= _ "A vessel holding a fragment of the Lich Sovereign's soul. Destroy every phylactery to make the Lich mortal."
    # values are % damage taken: hard to break with weapons, fragile to arcane
    [resistance]
        blade=60
        pierce=60
        impact=80
        fire=80
        cold=40
        arcane=140
    [/resistance]
[/unit_type]

[unit_type]
    id=WC3 Wyrm
    name= _ "Wyrm of the Last Age"
    race=drake
    image="units/wc3-bosses/wyrm.png"
    profile="portraits/wc3-bosses/wyrm.png"
    hitpoints=150
    movement_type=drakefly
    movement=8
    experience=500
    level=5
    alignment=chaotic
    advances_to=null
    cost=300
    usage=fighter
    do_not_list=yes
    die_sound=drake-die.ogg
    description= _ "The last of the great dragons. The air around it burns; those who stand beside it for long are seared to the bone."
    [abilities]
        {ABILITY_REGENERATES}
        [dummy]
            id=wc3_scorching_aura
            name= _ "scorching aura"
            description= _ "Enemy units adjacent to this unit take 8 fire damage at the start of their turn. This damage cannot kill."
        [/dummy]
    [/abilities]
    [attack]
        name=devour
        description= _ "devour"
        icon=attacks/fangs-animal.png
        type=blade
        range=melee
        damage=25
        number=1
        [specials]
            [damage]
                id=supercharge
                name= _ "supercharge"
                description= _ "When used offensively, this attack deals quadruple damage to the target. It also causes this unit to take quadruple damage from the target's counterattack."
                multiply=4
                apply_to=both
                active_on=offense
            [/damage]
        [/specials]
    [/attack]
    [attack]
        name=tail sweep
        description= _ "tail sweep"
        icon=attacks/tail-dragon.png
        type=impact
        range=melee
        damage=14
        number=2
        [specials]
            {WEAPON_SPECIAL_STUN}
        [/specials]
    [/attack]
    [attack]
        name=inferno
        description= _ "inferno"
        icon=attacks/fire-breath-drake.png
        type=fire
        range=ranged
        damage=11
        number=4
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
            [poison]
                id=poison
                name= _ "burning"
                description= _ "This attack sets living targets ablaze. Burning units lose 8 HP every turn until they are cured or reduced to 1 HP, like poison. It cannot, of itself, kill a unit."
            [/poison]
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=devour
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wc3-bosses/wyrm.png:400"
        [/frame]
        {SOUND:HIT_AND_MISS bite.ogg {SOUND_LIST:MISS} -75}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=tail sweep
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wc3-bosses/wyrm.png:400"
        [/frame]
        {SOUND:HIT_AND_MISS tail.ogg {SOUND_LIST:MISS} -75}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=inferno
        [/filter_attack]
        [frame]
            image="units/wc3-bosses/wyrm.png:400"
        [/frame]
        missile_start_time=-240
        [if]
            direction=n,ne,nw
            [missile_frame]
                image="projectiles/fire-breath-ne-[1~5].png~FL():80"
                image_diagonal="projectiles/fire-breath-n-[1~5].png:80"
                offset=0.0~1.1
                directional_x=50~0
                y=-30~-10
            [/missile_frame]
        [/if]
        [else]
            direction=s,se,sw
            [missile_frame]
                image="projectiles/fire-breath-se-[1~5].png~FL():80"
                image_diagonal="projectiles/fire-breath-s-[1~5].png:80"
                offset=0.0~1.1
                directional_x=50~0
                y=30~0
            [/missile_frame]
        [/else]
        [if]
            hits=yes
            [impact_frame]
                layer=90
                image="misc/blank-hex.png:1,projectiles/fireball-impact-[2~5].png:60,projectiles/fire-breath-[6~10].png:40"
                offset=1.0
            [/impact_frame]
        [/if]
        {SOUND:HIT_AND_MISS flame-big.ogg flame-big-miss.ogg -250}
    [/attack_anim]
[/unit_type]

[unit_type]
    id=WC3 Usurper
    name= _ "The Usurper"
    race=human
    gender=male
    image="units/wc3-bosses/usurper.png"
    profile="portraits/wc3-bosses/usurper.png"
    hitpoints=102
    movement_type=smallfoot
    movement=6
    experience=500
    level=5
    alignment=lawful
    advances_to=null
    cost=300
    usage=fighter
    do_not_list=yes
    die_sound={SOUND_LIST:HUMAN_DIE}
    description= _ "A marshal who seized the throne and bound his officers to him by oath. While his lieutenants live, their loyalty shields him."
    [abilities]
        {ABILITY_REGENERATES}
        {ABILITY_SKIRMISHER}
        {ABILITY_STEADFAST}
        [leadership]
            id=wc3_tyrants_command
            value=25
            cumulative=no
            name= _ "tyrant's command"
            description= _ "Adjacent allied units of any level deal 25% more damage."
            affect_self=no
            affect_allies=yes
            [affect_adjacent]
            [/affect_adjacent]
        [/leadership]
        [dummy]
            id=wc3_royal_shield
            name= _ "royal shield"
            description= _ "Each of this unit's living lieutenants grants it +25% resistance to all damage types."
        [/dummy]
    [/abilities]
    [attack]
        name=kingsblade
        description= _ "kingsblade"
        icon=attacks/greatsword-human.png
        type=blade
        range=melee
        damage=12
        number=4
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]
    [attack]
        name=executioners stroke
        description= _ "executioner's stroke"
        icon=attacks/longsword.png
        type=blade
        range=melee
        damage=16
        number=2
        [specials]
            [damage]
                id=wc3_execute
                name= _ "execute"
                description= _ "This attack deals double damage to targets that start the fight below half of their maximum hitpoints."
                multiply=2
                [filter_opponent]
                    formula="hitpoints * 2 < max_hitpoints"
                [/filter_opponent]
            [/damage]
        [/specials]
    [/attack]
    [attack]
        name=crossbow
        description= _ "crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=kingsblade,executioners stroke
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/wc3-bosses/usurper.png:400"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-300
        [frame]
            image="units/wc3-bosses/usurper.png:400"
        [/frame]
        {SOUND:HIT_AND_MISS crossbow.ogg crossbow-miss.ogg -300}
    [/attack_anim]
[/unit_type]
