#textdomain wesnoth-wc

[resolution]
    maximum_width = 900
    maximum_height = 750
    [helptip]
        id = "tooltip_large"
    [/helptip]
    [tooltip]
        id = "tooltip_large"
    [/tooltip]

    [grid]
        # Header: title + gold + discount
        [row]
            grow_factor = 0
            [column]
                horizontal_grow = true
                border = "all"
                border_size = 5
                [grid]
                    [row]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "left"
                            [label]
                                definition = "title"
                                id = "title"
                                label = _ "★ Hero Gacha ★"
                            [/label]
                        [/column]
                        [column]
                            grow_factor = 0
                            horizontal_alignment = "right"
                            border = "left"
                            border_size = 10
                            [label]
                                definition = "gold"
                                id = "gold_label"
                                use_markup = true
                            [/label]
                        [/column]
                        [column]
                            grow_factor = 0
                            horizontal_alignment = "right"
                            border = "left"
                            border_size = 10
                            [label]
                                id = "discount_label"
                                use_markup = true
                            [/label]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]

        # Hero image — big and centered
        [row]
            grow_factor = 0
            [column]
                horizontal_alignment = "center"
                border = "top,bottom"
                border_size = 5
                [image]
                    id = "hero_image"
                    definition = "default"
                [/image]
            [/column]
        [/row]

        # Hero name + stats — centered
        [row]
            grow_factor = 0
            [column]
                horizontal_alignment = "center"
                border = "all"
                border_size = 3
                [label]
                    id = "hero_name_label"
                    use_markup = true
                [/label]
            [/column]
        [/row]

        # Attacks line — centered
        [row]
            grow_factor = 0
            [column]
                horizontal_alignment = "center"
                border = "left,right,bottom"
                border_size = 3
                [label]
                    id = "hero_attacks_label"
                    use_markup = true
                [/label]
            [/column]
        [/row]

        # Slot results: bonuses displayed like slot machine output
        [row]
            grow_factor = 0
            [column]
                horizontal_alignment = "center"
                border = "all"
                border_size = 8
                [label]
                    id = "bonus_slots_label"
                    use_markup = true
                [/label]
            [/column]
        [/row]

        # Reroll buttons — machine-style row
        [row]
            grow_factor = 0
            [column]
                horizontal_grow = true
                border = "left,right"
                border_size = 5
                [grid]
                    [row]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "center"
                            border = "all"
                            border_size = 3
                            [button]
                                id = "reroll_all_btn"
                                label = _ "↻ Reroll All"
                            [/button]
                        [/column]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "center"
                            border = "all"
                            border_size = 3
                            [button]
                                id = "reroll_bonuses_btn"
                                label = _ "↻ Reroll Bonuses"
                            [/button]
                        [/column]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "center"
                            border = "all"
                            border_size = 3
                            [button]
                                id = "reroll_bigger_btn"
                                label = _ "↻ Reroll Bigger"
                            [/button]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]

        # Accept + Skip
        [row]
            grow_factor = 0
            [column]
                horizontal_grow = true
                border = "all"
                border_size = 5
                [grid]
                    [row]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "center"
                            border = "all"
                            border_size = 5
                            [button]
                                definition = "really_large"
                                id = "accept_btn"
                                return_value = 1
                                label = _ "★ Accept Hero ★"
                            [/button]
                        [/column]
                        [column]
                            grow_factor = 0
                            horizontal_alignment = "center"
                            border = "all"
                            border_size = 5
                            [button]
                                id = "cancel"
                                label = _ "Skip"
                            [/button]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]
    [/grid]
[/resolution]
