#textdomain wesnoth-wc

{gui/macros}

[resolution]
    maximum_width = 1200
    maximum_height = 700
    [helptip]
        id = "tooltip_large"
    [/helptip]
    [tooltip]
        id = "tooltip_large"
    [/tooltip]

    [linked_group]
        id = "list_icon"
        fixed_width = true
    [/linked_group]

    [grid]
        # Header row: title + gold + discount
        [row]
            grow_factor = 0
            [column]
                horizontal_grow = true
                border = "all"
                border_size = 5
                [grid]
                    [row]
                        [column]
                            grow_factor = 1
                            horizontal_alignment = "left"
                            [label]
                                definition = "title"
                                id = "title"
                                label = _ "World Conquest III — Shop"
                            [/label]
                        [/column]
                        [column]
                            grow_factor = 0
                            horizontal_alignment = "right"
                            border = "left"
                            border_size = 10
                            [label]
                                definition = "gold"
                                id = "gold_label"
                                use_markup = true
                            [/label]
                        [/column]
                        [column]
                            grow_factor = 0
                            horizontal_alignment = "right"
                            border = "left"
                            border_size = 10
                            [label]
                                id = "discount_label"
                                use_markup = true
                            [/label]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]

        # Main content: listbox on left, detail pane on right
        [row]
            grow_factor = 1
            [column]
                horizontal_grow = true
                vertical_grow = true
                [grid]
                    [row]
                        # Left: item listbox
                        [column]
                            border = "all"
                            border_size = 5
                            horizontal_grow = true
                            vertical_grow = true
                            [listbox]
                                id = "shop_list"
                                definition = "default"
                                horizontal_scrollbar_mode = "never"
                                vertical_scrollbar_mode = "initial_auto"
                                [list_definition]
                                    [row]
                                        [column]
                                            horizontal_grow = true
                                            [toggle_panel]
                                                id = "shop_panel"
                                                [grid]
                                                    [row]
                                                        [column]
                                                            grow_factor = 0
                                                            horizontal_alignment = "left"
                                                            border = "all"
                                                            border_size = 3
                                                            [image]
                                                                id = "item_icon"
                                                                linked_group = "list_icon"
                                                            [/image]
                                                        [/column]
                                                        [column]
                                                            grow_factor = 1
                                                            horizontal_grow = true
                                                            border = "all"
                                                            border_size = 3
                                                            [grid]
                                                                [row]
                                                                    [column]
                                                                        horizontal_alignment = "left"
                                                                        grow_factor = 1
                                                                        [label]
                                                                            id = "item_name"
                                                                            use_markup = true
                                                                        [/label]
                                                                    [/column]
                                                                [/row]
                                                                [row]
                                                                    [column]
                                                                        horizontal_alignment = "left"
                                                                        grow_factor = 1
                                                                        [label]
                                                                            id = "item_price"
                                                                            use_markup = true
                                                                        [/label]
                                                                    [/column]
                                                                [/row]
                                                            [/grid]
                                                        [/column]
                                                    [/row]
                                                [/grid]
                                            [/toggle_panel]
                                        [/column]
                                    [/row]
                                [/list_definition]
                            [/listbox]
                        [/column]

                        # Right: detail pane + buy button
                        [column]
                            vertical_grow = true
                            border = "all"
                            border_size = 5
                            [grid]
                                [row]
                                    grow_factor = 1
                                    [column]
                                        horizontal_grow = true
                                        vertical_grow = true
                                        [scroll_label]
                                            id = "detail_text"
                                            label = ""
                                            use_markup = true
                                        [/scroll_label]
                                    [/column]
                                [/row]
                                [row]
                                    grow_factor = 0
                                    [column]
                                        horizontal_alignment = "center"
                                        border = "all"
                                        border_size = 5
                                        [button]
                                            definition = "really_large"
                                            id = "ok"
                                            label = _ "Buy"
                                        [/button]
                                    [/column]
                                [/row]
                            [/grid]
                        [/column]
                    [/row]
                [/grid]
            [/column]
        [/row]

        # Footer: done button
        [row]
            grow_factor = 0
            [column]
                horizontal_alignment = "center"
                border = "all"
                border_size = 5
                [button]
                    id = "cancel"
                    label = _ "Done Shopping"
                [/button]
            [/column]
        [/row]
    [/grid]
[/resolution]
