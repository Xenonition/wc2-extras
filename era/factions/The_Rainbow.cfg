#textdomain wesnoth-wc

# WC3: one unit from every faction, Empire-style own hero lists (era/campaign/heroes.cfg Rainbow_*),
# with base-game units WC2 only hands out as heroes (Peasant, Walking Corpse, Sergeant,
# Skeleton Rider) as recruits
#define MULTIPLAYER_SIDE_THE_RAINBOW
    [multiplayer_side]
        id=The Rainbow
        name=_"The Rainbow"
        recruit=Elvish Shaman,Dune Herbalist,Raven,Falcon,Skeleton Rider,Gryphon Rider,Walking Corpse,Peasant,Sergeant,Orcish Leader,Heavy Infantryman,Troll Whelp,Drake Burner,Elvish Archer
        image="misc/blank-hex.png~BLIT(units/elves-wood/shaman.png~RC(magenta>purple)~CROP(0,0,60,72),12,0)~BLIT(units/human-peasants/peasant.png~RC(magenta>orange)~CROP(8,0,58,72),0,0)"
        type=random
        leader=Lieutenant,Elvish Druid,Orcish Warrior,Drake Flare,Dwarvish Steelclad,Troll
        random_leader=Lieutenant,Elvish Druid,Orcish Warrior,Drake Flare,Dwarvish Steelclad,Troll
        [world_conquest_data]
            commanders=Rainbow_commanders
            heroes=Rainbow_heroes
            deserters=Rainbow_deserters,Young Ogre
            {WC_II_PAIR "Elvish Shaman" "Dune Herbalist"}
            {WC_II_PAIR "Raven" "Falcon"}
            {WC_II_PAIR "Skeleton Rider" "Gryphon Rider"}
            {WC_II_PAIR "Walking Corpse" "Peasant"}
            {WC_II_PAIR "Sergeant" "Orcish Leader"}
            {WC_II_PAIR "Heavy Infantryman" "Troll Whelp"}
            {WC_II_PAIR "Drake Burner" "Elvish Archer"}
        [/world_conquest_data]
    [/multiplayer_side]
#enddef
