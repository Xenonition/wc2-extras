#textdomain wesnoth-wc

# WC3: a mobile faction. Nearly every recruit moves 7+; the slow exceptions are the support and
# magic pairs, which have no mobile level-1 equivalent. Sturdier line units come only as heroes
# (era/campaign/heroes.cfg Outriders_*).
#define MULTIPLAYER_SIDE_THE_OUTRIDERS
    [multiplayer_side]
        id=The Outriders
        name=_"The Outriders"
        recruit=Cavalryman,Wolf Rider,Dune Rider,Elvish Scout,Horseman,Gryphon Rider,Drake Glider,Saurian Skirmisher,Ghost,Skeleton Rider,Falcon,Vampire Bat,Elvish Shaman,Saurian Augur,Mage,Dark Adept
        image="misc/blank-hex.png~BLIT(units/dunefolk/rider/rider.png~RC(magenta>orange)~CROP(10,0,62,72),10,0)~BLIT(units/human-loyalists/cavalryman/cavalryman.png~RC(magenta>blue)~CROP(0,0,62,72),0,0)"
        type=random
        leader=Dragoon,Elvish Rider,Goblin Knight,Gryphon Master,Dune Sunderer
        random_leader=Dragoon,Elvish Rider,Goblin Knight,Gryphon Master,Dune Sunderer
        [world_conquest_data]
            commanders=Outriders_commanders
            heroes=Outriders_heroes
            deserters=Outriders_deserters,Young Ogre
            {WC_II_PAIR "Cavalryman" "Wolf Rider"}
            {WC_II_PAIR "Dune Rider" "Elvish Scout"}
            {WC_II_PAIR "Horseman" "Gryphon Rider"}
            {WC_II_PAIR "Drake Glider" "Saurian Skirmisher"}
            {WC_II_PAIR "Ghost" "Skeleton Rider"}
            {WC_II_PAIR "Falcon" "Vampire Bat"}
            {WC_II_PAIR "Elvish Shaman" "Saurian Augur"}
            {WC_II_PAIR "Mage" "Dark Adept"}
        [/world_conquest_data]
    [/multiplayer_side]
#enddef
